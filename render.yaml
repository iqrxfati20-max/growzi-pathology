services:
  - type: web
    name: growzi-pathology
    runtime: node
    rootDir: artifacts/api-server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/healthz
    disk:
      name: growzi-data
      mountPath: /data
      sizeGB: 1
